      <h2>1929</h2>
      <p>
        <b>1929</b><br />
        <b>Citat om Korea</b>, av den store indiske poeten och Nobelpristagaren Rabindranath <b>Tagore</b>:<br />
        "I Asiens gyllene tidsålder<br />
        så var Korea en av dess ljus-bärare<br />
        och
        <b
          >det ljuset väntar<br />
          att åter bli tänt<br />
          för upplysningen av Östern</b
        >."
      </p>
